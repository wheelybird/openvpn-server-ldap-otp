name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Run configuration tests
        run: for t in tests/test_*.sh; do echo "== $t"; bash "$t" || exit 1; done

      - name: Build image
        run: docker build -t openvpn-ldap-otp:ci .
